# ETF选择优先级建议
selection_guide:
  原则: |
    1. 优先选择与目标股票同行业/同主题的ETF
    2. 查看ETF持仓，确认目标股票在成分股中的权重
    3. 权重越高，替代效果越好
    4. 如果单只股票权重<3%，替代效果可能不理想
    5. 可以考虑组合多只ETF来提高覆盖率

  检查清单:
    - "查看ETF最新的持仓明细"
    - "确认目标股票在成分股中的排名"
    - "计算目标股票占ETF净值的比例"
    - "评估ETF的流动性和规模"
    - "对比不同ETF的管理费率和跟踪误差"

# 风险提示
warnings:
  - "ETF包含多只股票，无法完全复制单只股票的表现"
  - "如果目标股票暴涨但其他成分股下跌，ETF可能不涨甚至下跌"
  - "科创板ETF也有涨跌幅限制（20%），波动较大"
  - "ETF存在跟踪误差，长期可能跑输指数"
  - "建议作为'次优选择'，而非'完全替代'"
