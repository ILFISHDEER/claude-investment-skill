# 模块依赖与冲突规则
# AI 生成报告时，按此规则检查模块组合合法性

requires:
  # 产业链拆解必须先于铲子股筛选
  - before: "04-铲子股筛选"
    after: "03-产业链拆解"

  # 产业链全景图谱基于产业链拆解
  - before: "15-产业链全景图谱"
    after: "03-产业链拆解"

  # 铲子股筛选依赖产业链拆解和全景图谱
  - before: "04-铲子股筛选"
    after: "15-产业链全景图谱"

  # 护城河评估必须先于组合构建
  - before: "09-组合构建"
    after: "05-护城河评估"

  # 风险矩阵必须先于组合构建
  - before: "09-组合构建"
    after: "08-风险矩阵与对冲"

  # 铲子股筛选必须先于护城河评估
  - before: "05-护城河评估"
    after: "04-铲子股筛选"

  # 组合构建必须先于实操指南
  - before: "10-实操指南"
    after: "09-组合构建"

  # 动态跟踪机制必须先于预测与实际对比
  - before: "12-预测与实际对比"
    after: "11-动态跟踪机制"

  # 供应链分析基于产业链拆解和全景图谱
  - before: "16-供应链分析"
    after: "03-产业链拆解"
  - before: "16-供应链分析"
    after: "15-产业链全景图谱"

  # 市场情绪分析建议作为首个模块
  - before: "01-市场环境扫描"
    after: "00-市场情绪分析"
    optional: true

mutually_exclusive:
  # 不同市场的开户指南互斥
  - group: "市场开户指南"
    options:
      - "美股开户"
      - "A股开户"
      - "港股开户"

execution_order:
  - "00-市场情绪分析"
  - "01-市场环境扫描"
  - "02-核心投资哲学"
  - "03-产业链拆解"
  - "15-产业链全景图谱"
  - "04-铲子股筛选"
  - "05-护城河评估"
  - "06-催化剂日历"
  - "07-中美对比矩阵"
  - "08-风险矩阵与对冲"
  - "09-组合构建"
  - "10-实操指南"
  - "11-动态跟踪机制"
  - "12-预测与实际对比"
  - "13-ETF备选与核心逻辑"
  - "14-深度核心逻辑摘要"
  - "16-供应链分析"
