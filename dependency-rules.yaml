# 模块依赖与冲突规则
# AI 生成报告时，按此规则检查模块组合合法性

requires:
  # 产业链拆解必须先于铲子股筛选
  - before: "04-铲子股筛选"
    after: "03-产业链拆解"

  # 护城河评估必须先于组合构建
  - before: "09-组合构建"
    after: "05-护城河评估"

  # 风险矩阵必须先于组合构建
  - before: "09-组合构建"
    after: "08-风险矩阵与对冲"

  # 市场情绪分析建议作为首个模块
  - before: "01-市场环境扫描"
    after: "00-市场情绪分析"
    optional: true

mutually_exclusive:
  # 不同市场的开户指南互斥
  - group: "市场开户指南"
    options:
      - "美股开户"
      - "A股开户"
      - "港股开户"

execution_order:
  - "00-市场情绪分析"
  - "01-市场环境扫描"
  - "02-核心投资哲学"
  - "03-产业链拆解"
  - "04-铲子股筛选"
  - "05-护城河评估"
  - "06-催化剂日历"
  - "07-中美对比矩阵"
  - "08-风险矩阵与对冲"
  - "09-组合构建"
  - "10-实操指南"
  - "11-动态跟踪机制"
  - "12-预测与实际对比"
