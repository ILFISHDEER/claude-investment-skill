---
# L4-手册 模板配置
template_id: "L4"
template_name: "手册"
description: "投资手册，专题深度研究"
target_reader: "深度研究员/专栏作家"
pages: "专题长度，无上限"
auto_numbering: true

# 模块配置
modules:
  required:
    - "00-市场情绪分析"
    - "01-市场环境扫描"
    - "02-核心投资哲学"
    - "03-产业链拆解"  # 深度拆解
    - "04-铲子股筛选"
    - "05-护城河评估"
    - "06-催化剂日历"
    - "07-中美对比矩阵"
    - "08-风险矩阵与对冲"
    - "09-组合构建"
    - "10-实操指南"
    - "11-动态跟踪机制"
    - "12-预测与实际对比"
    - "13-ETF备选与核心逻辑"
    - "14-深度核心逻辑摘要"
    - "15-产业链全景图谱"
  optional: []
  excluded: []  # L4包含所有模块

# 章节结构
sections:
  - id: "executive_summary"
    title: "执行摘要"
    required: true
    source: "ai_generated"
    max_length: "1000字"
  - id: "00"
    module: "00-市场情绪分析"
    title: "市场情绪分析"
    required: true
    max_depth: 4  # 可完全展开
  - id: "01"
    module: "01-市场环境扫描"
    title: "市场环境扫描"
    required: true
    max_depth: 4
  - id: "02"
    module: "02-核心投资哲学"
    title: "核心投资哲学"
    required: true
    max_depth: 4
  - id: "14"
    module: "14-深度核心逻辑摘要"
    title: "深度核心逻辑摘要"
    required: true
    max_depth: 4
  - id: "03"
    module: "03-产业链拆解"
    title: "产业链全景拆解"
    required: true
    max_depth: 5  # 可展开到五级标题
    table_required: true
    mermaid_required: true
  - id: "15"
    module: "15-产业链全景图谱"
    title: "产业链全景图谱"
    required: true
    max_depth: 5
    table_required: true
  - id: "04"
    module: "04-铲子股筛选"
    title: "铲子股筛选框架"
    required: true
    max_depth: 4
    table_required: true
  - id: "05"
    module: "05-护城河评估"
    title: "护城河评估"
    required: true
    max_depth: 4
    table_required: true
  - id: "06"
    module: "06-催化剂日历"
    title: "催化剂日历"
    required: true
    max_depth: 4
    table_required: true
  - id: "07"
    module: "07-中美对比矩阵"
    title: "中美对比矩阵"
    required: true
    max_depth: 4
    table_required: true
  - id: "08"
    module: "08-风险矩阵与对冲"
    title: "风险矩阵与对冲"
    required: true
    max_depth: 4
    table_required: true
  - id: "09"
    module: "09-组合构建"
    title: "投资组合建议"
    required: true
    max_depth: 4
    table_required: true
  - id: "10"
    module: "10-实操指南"
    title: "实操指南"
    required: true
    max_depth: 4
  - id: "11"
    module: "11-动态跟踪机制"
    title: "动态跟踪机制"
    required: true
    max_depth: 3
  - id: "12"
    module: "12-预测与实际对比"
    title: "预测与实际对比"
    required: true
    max_depth: 4
  - id: "13"
    module: "13-ETF备选与核心逻辑"
    title: "ETF备选与核心逻辑"
    required: true
    max_depth: 4
  - id: "appendix"
    title: "附录"
    required: true
    source: "ai_generated"
    sections:
      - "数据来源"
      - "术语表"
      - "参考文献"
      - "免责声明"

# 输出要求
output:
  min_length: "20000字"
  max_length: "无上限"
  required_elements:
    - "完整执行摘要"
    - "详细市场环境"
    - "完整投资框架"
    - "产业链拆解（全层级）"
    - "铲子股深度筛选"
    - "护城河详细评估"
    - "催化剂完整日历"
    - "中美全面对比"
    - "风险矩阵完整分析"
    - "组合配置建议"
    - "实操完整指南"
    - "动态跟踪SOP"
    - "预测与实际对比"
    - "ETF深度分析"
    - "附录"

# 格式要求
formatting:
  table_priority: true
  table_min_count: 20
  mermaid_required: true  # 必须有Mermaid图表
  chart_support: true
  image_support: true
  cross_reference: true  # 支持章节交叉引用
  footnote_support: true  # 支持脚注

# 元数据要求
metadata:
  required_fields:
    - "report_theme"
    - "report_theme_id"
    - "report_description"
    - "report_depth"
    - "report_style"
    - "report_market_focus"
    - "report_date"
    - "report_version"
    - "generated_by_modules"
    - "total_modules"
    - "data_snapshot"
    - "word_count"  # L4特有
    - "reading_time"  # 预估阅读时间

# 验证规则
validation:
  check_placeholders: true
  placeholder_threshold: 50
  check_module_footers: true
  module_footer_coverage: 1.0  # 100%章节必须有来源标记
  check_data_freshness: true
  data_max_age: 7
  check_chapter_continuity: true
  check_table_completeness: true
  check_mermaid_syntax: true  # 检查Mermaid语法
  check_cross_references: true  # 检查交叉引用
