# Investment Skill — 物理AI主题配置
# Physical AI: 物理世界中的AI应用，机器人/具身智能/无人机

meta:
  skill_version: "2.0"
  generated_at: "2026-05-24"

# === 报告主题 ===
theme:
  name: "物理AI产业链深度分析"
  id: "physical-ai"
  description: "Physical AI：AI在物理世界的应用，包括人形机器人、工业机器人、无人机等"

# === 输出控制 ===
output:
  depth: "L4"
  style: "专业投研风"
  market_focus: "中美双线"

# === 产业链层级定义（物理AI六层）===
industry_layers:
  - name: "终端整机"
    id: "terminal"
    description: "人形机器人/工业机器人/无人机整机"
    key_metrics: ["出货量", "渗透率", "ASP", "客户集中度"]

  - name: "大脑算法"
    id: "brain"
    description: "AI大模型/感知算法/决策算法"
    key_metrics: ["参数量", "响应延迟", "准确率", "泛化能力"]

  - name: "传感器"
    id: "sensors"
    description: "视觉/雷达/力矩/IMU传感器"
    key_metrics: ["精度", "成本", "功耗", "可靠性"]

  - name: "执行器"
    id: "actuators"
    description: "电机/减速器/丝杠/液压"
    key_metrics: ["扭矩密度", "响应速度", "寿命", "成本"]

  - name: "结构件"
    id: "structure"
    description: "轻量化材料/外壳/散热"
    key_metrics: ["重量", "强度", "成本", "可制造性"]

  - name: "系统集成"
    id: "integration"
    description: "软硬件集成/测试/部署"
    key_metrics: ["良率", "交付周期", "售后成本"]

# === IC Score权重（物理AI调整）===
ic_score_weights:
  I_irreplaceability: 35
  C_customer_concentration: 15
  T_technology_barrier: 30
  S_scale_effect: 15
  M_market_liquidity: 5

# === 供应链层级定义 ===
