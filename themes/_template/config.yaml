## 主题切换指南

### 1. 创建主题目录

```bash
mkdir -p data/新能源/
cp data/孙哥方向/* data/新能源/
# 修改tickers.yaml为新能源相关股票
```

### 2. 创建主题配置

```bash
cp config-theme-template.yaml config-新能源.yaml
# 按新能源修改配置
```

### 3. 运行主题分析

```bash
python multi_agent_orchestrator.py --config config-新能源.yaml --parallel
```

---

## 关键设计原则

### 1. 层级可配置
每个主题的"七层"定义不同：
- 孙哥方向：AI Brain → Compute → Sensors → Actuators → Materials → Integration → Industrial
- 新能源：原材料 → 电池材料 → 电芯制造 → Pack → BMS → 系统集成 → 应用
- 量子计算：量子比特 → 控制 → 纠错 → 软件 → 云平台 → 应用

### 2. IC Score权重可调
不同行业权重不同：
- 科技行业：技术壁垒权重高(30%)
- 制造业：规模效应权重高(20%)
- 医药行业：客户集中度权重低(15%，分散风险重要)

### 3. 数据隔离
每个主题独立目录：
```
data/
├── 孙哥方向/
├── 新能源/
├── 量子计算/
└── 生物医药/
```

### 4. 模块复用
通用模块(00-13)复用，主题特定模块(15/16)按主题定制。

