## 新增主题检查清单

- [ ] 创建 `data/{theme-id}/` 目录
- [ ] 创建 `tickers.yaml` 股票清单
- [ ] 创建 `valuation.yaml` 估值数据
- [ ] 创建 `config-{theme}.yaml` 主题配置
- [ ] 定义产业链七层
- [ ] 调整IC Score权重
- [ ] 测试运行 `python multi_agent_orchestrator.py --config config-{theme}.yaml --simulate`
