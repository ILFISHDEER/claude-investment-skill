# 主题配置模板

> **版本**: v1.0
> **用途**: 创建新的投资主题配置

---

## 快速开始

复制本模板，修改以下关键字段即可创建新主题。

---

## 配置结构

```yaml
# === 主题基本信息 ===
meta:
  skill_version: "2.0"
  generated_at: "2026-05-24"

# === 报告主题 ===
theme:
  name: "主题名称"
  id: "theme-id"                    # 英文ID，用于文件路径
  description: "主题描述"

# === 产业链层级定义 ===
# 每个主题有自己的"七层"定义
industry_layers:
  - name: "层级1名称"
    id: "layer-1"
    description: "层级描述"
    key_metrics: ["关键指标1", "关键指标2"]

  - name: "层级2名称"
    id: "layer-2"
    description: "层级描述"
    key_metrics: ["关键指标1", "关键指标2"]

  # ... 继续定义

# === IC Score权重配置 ===
# 不同主题的IC Score权重可以不同
ic_score_weights:
  I_irreplaceability: 30    # 不可替代性
  C_customer_concentration: 25  # 客户集中度
  T_technology_barrier: 25  # 技术壁垒
  S_scale_effect: 15       # 规模效应
  M_market_liquidity: 5    # 市值流动性

# === 供应链层级定义 ===
supply_chain_layers:
  - "原材料层"
  - "基础材料层"
  - "核心器件层"
  - "模组组件层"
  - "系统集成层"
  - "终端应用层"

# === 模块开关 ===
modules:
  enabled:
    - "00-市场情绪分析"
    - "01-市场环境扫描"
    - "02-核心投资哲学"
    - "03-产业链拆解"
    - "16-供应链分析"           # 可选，挖掘隐形冠军
    - "15-产业链全景图谱"
    - "04-铲子股筛选"
    - "05-护城河评估"
    - "06-催化剂日历"
    - "07-中美对比矩阵"
    - "08-风险矩阵与对冲"
    - "09-组合构建"
    - "10-实操指南"
    - "11-动态跟踪机制"
    - "12-预测与实际对比"
    - "13-ETF备选与核心逻辑"
    - "14-深度核心逻辑摘要"

# === 框架嵌入 ===
frameworks:
  - "二阶三阶思维"
  - "晨星护城河评级"
  - "费雪成长股原则"

# === 数据路径 ===
data_path: "data/{theme-id}/"

# === 主题特定配置 ===
theme_specific:
  # 新能源示例
  key_materials: ["锂", "钴", "镍", "稀土"]
  key_metrics: ["能量密度", "循环寿命", "成本下降曲线"]
  policy_drivers: ["双碳目标", "补贴政策", "储能要求"]

  # 量子计算示例
  # key_technology: ["超导", "离子阱", "光量子", "硅量子"]
  # key_metrics: ["量子比特数", "相干时间", "错误率"]
  # milestones: ["量子优越性", "量子纠错", "实用化"]
```

