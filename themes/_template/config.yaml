## 主题示例

### 示例1: 新能源

```yaml
theme:
  name: "新能源产业链全景分析"
  id: "new-energy"
  description: "锂电池、储能、光伏、氢能等新能源产业链"

industry_layers:
  - name: "原材料"
    id: "materials"
    description: "锂/钴/镍/稀土等矿产资源"
    key_metrics: ["储量", "开采成本", "回收率"]

  - name: "电池材料"
    id: "battery-materials"
    description: "正极/负极/隔膜/电解液"
    key_metrics: ["能量密度", "循环寿命", "成本"]

  - name: "电芯制造"
    id: "cell-manufacturing"
    description: "动力电池/储能电池"
    key_metrics: ["产能", "良品率", "能量密度"]

  - name: "电池Pack"
    id: "battery-pack"
    description: "模组/Pack/热管理"
    key_metrics: ["成组效率", "安全性", "成本"]

  - name: "BMS/热管理"
    id: "bms-thermal"
    description: "电池管理系统/热管理"
    key_metrics: ["SOC精度", "热失控防护"]

  - name: "系统集成"
    id: "integration"
    description: "储能系统/整车集成"
    key_metrics: ["系统效率", "循环次数", "成本"]

  - name: "应用终端"
    id: "applications"
    description: "电动车/储能/消费电子"
    key_metrics: ["续航里程", "充电速度", "渗透率"]

ic_score_weights:
  I_irreplaceability: 30
  C_customer_concentration: 20    # 新能源客户相对分散
  T_technology_barrier: 25
  S_scale_effect: 20              # 新能源规模效应更重要
  M_market_liquidity: 5
theme_specific:
  key_materials: ["锂", "钴", "镍", "石墨", "稀土"]
  cost_curve: "$/kWh下降趋势"
  policy_drivers: ["双碳目标", "储能配比要求", "新能源补贴"]
```

### 示例2: 量子计算

```yaml
theme:
  name: "量子计算产业链分析"
  id: "quantum-computing"
  description: "量子计算硬件、软件、应用产业链"

industry_layers:
  - name: "量子比特技术"
    id: "qubit-tech"
    description: "超导/离子阱/光量子/硅量子"
    key_metrics: ["量子比特数", "相干时间", "门保真度"]

  - name: "量子控制"
    id: "quantum-control"
    description: "控制电子学/低温系统/微波"
    key_metrics: ["控制精度", "低温要求", "扩展性"]

  - name: "量子纠错"
    id: "quantum-error-correction"
    description: "纠错码/逻辑量子比特"
    key_metrics: ["逻辑错误率", "物理比特开销"]

  - name: "量子软件"
    id: "quantum-software"
    description: "编译器/算法/开发工具"
    key_metrics: ["算法效率", "开发者生态"]

  - name: "量子云平台"
    id: "quantum-cloud"
    description: "量子计算云服务"
    key_metrics: ["可用量子比特", "任务队列", "用户数量"]

  - name: "量子应用"
    id: "quantum-applications"
    description: "材料模拟/优化/密码学/AI"
    key_metrics: ["量子优势", "商业价值"]

ic_score_weights:
  I_irreplaceability: 35          # 量子计算技术独占性更重要
  C_customer_concentration: 20
  T_technology_barrier: 30        # 技术壁垒极高
  S_scale_effect: 10              # 规模效应相对不重要
  M_market_liquidity: 5
theme_specific:
  key_technology: ["超导", "离子阱", "光量子", "硅量子", "中性原子"]
  milestones: ["量子优越性", "量子纠错", "容错量子计算", "实用化"]
  key_metrics: ["量子比特数", "相干时间", "双量子比特门错误率"]
```

